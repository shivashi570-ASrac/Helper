<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELPER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#f4f4f4;color:#111}.app{max-width:520px;margin:auto;background:white;min-height:100vh}
header{background:#111;color:white;padding:18px;display:flex;justify-content:space-between}.logo{font-size:25px;font-weight:900}.badge{background:#ff6b00;padding:6px 10px;border-radius:20px}
main{padding:18px}.screen{display:none}.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.item{border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}.item{border-left:5px solid #ff6b00;background:#fafafa}
button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:11px;background:#ff6b00;color:#fff;font-weight:bold;font-size:15px}
button.light{background:#eee;color:#111}input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.price{font-size:24px;font-weight:bold;color:#ff6b00}.msg{padding:10px;background:#fff0e6;border-radius:10px;margin:10px 0}
nav{position:sticky;bottom:0;background:#111;padding:8px;display:flex;gap:5px}nav button{margin:0;background:#222;font-size:12px}
</style></head><body><div class="app">
<header><div class="logo">HELPER</div><div id="badge" class="badge">CUSTOMER</div></header>
<main>
<section id="auth" class="screen active"><h1>Welcome to HELPER</h1><p>Book help by the hour or request a ride.</p>
<div class="card"><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)">
<div id="authMsg" class="msg" style="display:none"></div><button onclick="signup()">Create account</button><button onclick="signin()">Sign in</button></div></section>
<section id="home" class="screen"><h1>Hello, <span id="hello">there</span> 👋</h1><div class="grid">
<button onclick="show('person')">👤 Book a Person</button><button onclick="show('ride')">🏍️ Ride</button><button onclick="show('bookings')">📋 My Bookings</button><button onclick="show('helper')">🧰 Helper</button></div></section>
<section id="person" class="screen"><h2>Book a Person</h2><div id="services" class="grid"></div>
<div id="personForm" class="card" style="display:none"><h3 id="serviceName"></h3><input id="hours" type="number" min="1" max="24" value="1" oninput="price()"><input id="taskLocation" placeholder="Task location"><textarea id="notes" placeholder="What do you need?"></textarea><div class="price" id="personPrice">₹0</div><button onclick="bookPerson()">Request Helper</button></div></section>
<section id="ride" class="screen"><h2>Book a Ride</h2><div class="grid"><button onclick="vehicle='bike'">🏍️ Bike</button><button onclick="vehicle='auto'">🛺 Auto</button><button onclick="vehicle='car'">🚗 Car</button></div>
<div class="card"><input id="pickup" placeholder="Pickup location"><input id="destination" placeholder="Destination"><button onclick="bookRide()">Request Ride</button></div></section>
<section id="bookings" class="screen"><h2>My Bookings</h2><div id="bookingList"></div></section>
<section id="helper" class="screen"><h2>Helper Partner</h2><div id="jobList"></div></section>
</main><nav id="nav" style="display:none"><button onclick="show('home')">Home</button><button onclick="show('bookings')">Bookings</button><button onclick="show('helper')">Helper</button><button onclick="logout()">Sign out</button></nav>
</div>
<script>
const URL='https://dfwamdeqrfubofraybsu.supabase.co',KEY='sb_publishable_KEgdWV-HYq8jGbXZ6rX3sw__e7AXz2H';
const db=supabase.createClient(URL,KEY);let user,profile,services=[],selected,vehicle;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='bookings')loadBookings();if(id==='person')loadServices();if(id==='helper')loadJobs()}
function notice(t){let e=document.getElementById('authMsg');e.textContent=t;e.style.display='block'}
async function signup(){try{let n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e)return notice('Please enter your email.');if(p.length<6)return notice('Password must be at least 6 characters.');let r=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(r.error)return notice(r.error.message);notice(r.data.session?'Account created. Signing you in...':'Account created. Check your email, then sign in.')}catch(x){notice('Error: '+x.message)}}
async function signin(){try{let e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return notice('Please enter your email and password.');let r=await db.auth.signInWithPassword({email:e,password:p});if(r.error)return notice(r.error.message);await boot()}catch(x){notice('Error: '+x.message)}}
let realtimeChannel=null;
function startRealtime(){
 if(realtimeChannel) db.removeChannel(realtimeChannel);
 realtimeChannel=db.channel('helper-bookings-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'bookings'},()=>{
   if(user && user.role==='helper') loadJobs();
   if(user && user.role==='customer') loadBookings();
  }).subscribe();
}
async function boot(){try{let r=await db.auth.getUser();user=r.data.user;if(!user)return;let p=await db.from('profiles').select('*').eq('id',user.id).single();if(p.error)return notice(p.error.message);profile=p.data;document.getElementById('hello').textContent=profile.full_name||'there';document.getElementById('badge').textContent=profile.role.toUpperCase();document.getElementById('nav').style.display='flex';startRealtime();show('home')}catch(x){notice('Error: '+x.message)}}
async function loadServices(){let r=await db.from('services').select('*').eq('active',true).order('name');services=r.data||[];servicesEl=document.getElementById('services');servicesEl.innerHTML=services.map(s=>`<button class="light" onclick="choose('${s.id}')">${s.name}<br>₹${s.rate_per_hour}/hour</button>`).join('')}
function choose(id){selected=services.find(s=>s.id===id);serviceName.textContent=selected.name;personForm.style.display='block';price()}
function price(){if(selected)personPrice.textContent='₹'+(Number(selected.rate_per_hour)*(Number(hours.value)||1))}
async function bookPerson(){let h=Math.max(1,Math.min(24,Number(hours.value)||1));let r=await db.from('bookings').insert({customer_id:user.id,booking_type:'person',service_id:selected.id,hours:h,task_location:taskLocation.value,notes:notes.value,estimated_price:Number(selected.rate_per_hour)*h,status:'searching'});if(r.error)return alert(r.error.message);alert('Helper request created');show('bookings')}
async function bookRide(){if(!vehicle)return alert('Choose bike, auto or car');let r=await db.from('bookings').insert({customer_id:user.id,booking_type:'ride',vehicle_type:vehicle,pickup_location:pickup.value,destination:destination.value,estimated_price:0,status:'searching'});if(r.error)return alert(r.error.message);alert('Ride request created');show('bookings')}
async function loadBookings(){let r=await db.from('bookings').select('*,services(name)').eq('customer_id',user.id).order('created_at',{ascending:false});bookingList.innerHTML=(r.data||[]).map(b=>'<div class="item"><b>'+ (b.booking_type==='person'?(b.services?.name||'Person help'):'Ride · '+b.vehicle_type)+'</b><br>'+b.status+'<br>₹'+Number(b.estimated_price).toFixed(0)+'</div>').join('')||'<p>No bookings yet.</p>'}
async function loadJobs(){if(profile.role!=='helper'){jobList.innerHTML='<div class="msg">This account is not assigned as a helper yet.</div>';return}let r=await db.from('bookings').select('*,services(name)').or('status.eq.searching,helper_id.eq.'+user.id).order('created_at',{ascending:false});jobList.innerHTML=(r.data||[]).map(b=>`<div class="item"><b>${b.services?.name||('Ride · '+b.vehicle_type)}</b><br>${b.status}${b.status==='searching'?`<button onclick="accept('${b.id}')">Accept</button>`:b.status==='accepted'?`<button onclick="status('${b.id}','in_progress')">Start</button>`:b.status==='in_progress'?`<button onclick="status('${b.id}','completed')">Complete</button>`:''}</div>`).join('')}
async function accept(id){let r=await db.rpc('accept_booking',{p_booking_id:id});if(r.error)alert(r.error.message);loadJobs()}
async function status(id,s){let r=await db.rpc('update_booking_status',{p_booking_id:id,p_status:s});if(r.error)alert(r.error.message);loadJobs()}
async function logout(){await db.auth.signOut();location.reload()}db.auth.getSession().then(r=>{if(r.data.session)boot()});
</script></body></html>
